<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1565C0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ежедневник АН">
<title>Ежедневник · АН</title>
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--blue:#1565C0;--blue-dark:#0D47A1;--blue-light:#E3F0FF;--txt:#1a1a2e;--dim:#78909C;--bg:#f0f4f8;--surf:#fff;--brd:#dde6f0;--fs:16px;--lh:1.75;--ff:'Roboto',sans-serif}
body{background:var(--bg);color:var(--txt);font-family:var(--ff);min-height:100dvh;transition:background .3s,color .3s}
.hdr{position:fixed;top:0;left:0;right:0;z-index:80;background:var(--blue);padding:10px 16px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 8px rgba(21,101,192,.3)}
.hdr-left{display:flex;align-items:center;gap:12px}
.hdr-name{color:#fff;font-size:16px;font-weight:500;line-height:1.2}
.hdr-sub{color:rgba(255,255,255,.75);font-size:11px;margin-top:1px}
.settings-btn{background:rgba(255,255,255,.15);border:none;border-radius:8px;width:38px;height:38px;cursor:pointer;color:#fff;display:flex;align-items:center;justify-content:center;transition:background .2s}
.bar{position:fixed;top:62px;left:0;right:0;height:3px;z-index:79;background:rgba(255,255,255,.4);transform-origin:left;transform:scaleX(0);transition:transform .1s linear}
main{padding:70px 8px 80px}
.date-row{margin-bottom:8px;padding:0 2px}
.date-pill{display:inline-block;background:var(--blue);color:#fff;border-radius:20px;padding:5px 14px;font-size:13px;font-weight:500}
.quote-card{background:var(--blue-dark);border-radius:12px;padding:12px 14px;margin-bottom:8px}
.quote-label{font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:rgba(255,255,255,.6);margin-bottom:7px;font-weight:500}
.quote-text{font-size:calc(var(--fs)*1.05);font-style:italic;color:#fff;line-height:1.5}
.quote-source{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.55);margin-top:8px;font-weight:500}
.body-card{background:var(--surf);border-radius:12px;padding:12px 14px;margin-bottom:8px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.body-text{font-size:var(--fs);line-height:var(--lh);color:var(--txt)}
.body-text p{margin-bottom:.75em}.body-text p:last-child{margin-bottom:0}
.aff-card{background:var(--blue-light);border-radius:12px;padding:10px 14px;margin-bottom:8px;border-left:4px solid var(--blue)}
.aff-label{font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:var(--blue);margin-bottom:6px;font-weight:600}
.aff-text{font-size:calc(var(--fs)*.95);font-style:italic;color:var(--blue-dark);line-height:1.5}
.actions{display:flex;gap:8px;margin-bottom:8px}
.act-btn{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;background:var(--surf);border:1px solid var(--brd);border-radius:10px;padding:10px;font-family:var(--ff);font-size:12px;color:var(--blue);cursor:pointer;font-weight:500}
.dots{display:flex;justify-content:center;gap:8px;margin-bottom:14px;padding-top:50px}
.dots span{width:10px;height:10px;border-radius:50%;background:var(--blue);animation:bounce 1.2s ease-in-out infinite}
.dots span:nth-child(2){animation-delay:.15s;opacity:.7}.dots span:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,80%,100%{transform:scale(.5);opacity:.3}40%{transform:scale(1);opacity:1}}
.loading-txt{text-align:center;color:var(--dim);font-size:14px}
.ovl{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .3s}
.ovl.on{opacity:1;pointer-events:all}
.panel{position:fixed;bottom:0;left:0;right:0;z-index:100;background:#fff;border-radius:20px 20px 0 0;padding:0 18px 36px;transform:translateY(100%);transition:transform .35s cubic-bezier(.32,.72,0,1);box-shadow:0 -4px 24px rgba(0,0,0,.12)}
.panel.on{transform:translateY(0)}
.hdl{width:36px;height:4px;border-radius:2px;background:#dde;margin:12px auto 18px}
.pt{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--blue);font-weight:600;margin-bottom:20px}
.sr{margin-bottom:20px}
.sl{font-size:12px;color:var(--dim);margin-bottom:10px;display:flex;justify-content:space-between;font-weight:500}
.sl span{color:var(--blue)}
input[type=range]{width:100%;height:4px;-webkit-appearance:none;appearance:none;background:#dde6f0;border-radius:2px;outline:none;accent-color:var(--blue)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:var(--blue);cursor:pointer;border:3px solid #fff;box-shadow:0 0 8px rgba(21,101,192,.4)}
.chips{display:flex;gap:8px}
.chip{flex:1;padding:8px 4px;border-radius:10px;border:1px solid var(--brd);background:none;color:var(--txt);cursor:pointer;transition:all .2s;text-align:center;font-size:13px;font-family:var(--ff)}
.chip.on{background:var(--blue);color:#fff;border-color:var(--blue);font-weight:600}
.sws{display:flex;gap:10px}
.sw{width:44px;height:44px;border-radius:12px;cursor:pointer;border:2px solid transparent;display:flex;align-items:center;justify-content:center;font-size:18px;transition:all .2s}
.sw.on{border-color:var(--blue);transform:scale(1.1)}
.toast{position:fixed;top:72px;left:50%;transform:translateX(-50%) translateY(-8px);background:var(--blue-dark);border-radius:20px;padding:8px 18px;font-size:12px;color:#fff;opacity:0;pointer-events:none;z-index:200;transition:all .3s;white-space:nowrap}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
body.sepia{--bg:#f5f0e8;--surf:#ede5d4;--brd:#d5c9b2;--txt:#2e2218;--dim:#8b7355;--blue:#8b6340;--blue-dark:#6b4c30;--blue-light:#f0e8d8}
body.night{--bg:#0d1117;--surf:#161b22;--brd:#21262d;--txt:#e6edf3;--dim:#7d8590;--blue:#388bfd;--blue-dark:#1f6feb;--blue-light:#1c2d3f}
body.forest{--bg:#0c1810;--surf:#12201a;--brd:#1c3025;--txt:#d0e8d4;--dim:#5a8a6a;--blue:#4caf70;--blue-dark:#2d7a4a;--blue-light:#1a3025}
</style>
</head>

<script>
const MO=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const DA=['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'];
const FONTS=["'Roboto',sans-serif","Georgia,serif","'Courier New',monospace"];
const THEMES=['','sepia','night','forest'];
const d=new Date();
const df=`${DA[d.getDay()]}, ${d.getDate()} ${MO[d.getMonth()]} ${d.getFullYear()}`;

async function loadToday(){
  const cacheKey='na_'+new Date().toISOString().slice(0,10);
  const cached=localStorage.getItem(cacheKey);
  if(cached){render(JSON.parse(cached));return;}
  try{
    const res=await fetch('/api/meditation',{signal:AbortSignal.timeout(10000)});
    if(!res.ok)throw new Error('bad response');
    const data=await res.json();
    if(data.body&&data.body.length>0){
      localStorage.setItem(cacheKey,JSON.stringify(data));
      for(const k of Object.keys(localStorage)){if(k.startsWith('na_20')&&k!==cacheKey)localStorage.removeItem(k);}
      render(data);
    } else throw new Error('empty');
  }catch(e){
    const keys=Object.keys(localStorage).filter(k=>k.startsWith('na_20')).sort();
    if(keys.length>0){render(JSON.parse(localStorage.getItem(keys[keys.length-1])));showToast('Нет сети — последний текст');}
    else render(null);
  }
}

function render(data){
  if(!data){document.getElementById('main').innerHTML='<div style="text-align:center;padding:60px 20px;color:var(--dim);font-size:14px">Не удалось загрузить.<br>Проверьте интернет.</div>';return;}
  const {quote,source,body,aff,date,title}=data;
  document.getElementById('main').innerHTML=`
    <div class="date-row"><div class="date-pill">${df}</div></div>
    ${title?`<div style="font-size:20px;font-weight:700;color:var(--txt);padding:4px 2px 8px;line-height:1.3">${title}</div>`:''}
    ${quote?`<div class="quote-card">
      <div class="quote-label">Цитата дня</div>
      <div class="quote-text">${quote}</div>
      ${source?`<div class="quote-source">${source}</div>`:''}
    </div>`:''}
    <div class="body-card">
      <div class="body-text" id="body">${(body||[]).map(p=>`<p>${p}</p>`).join('')}</div>
    </div>
    ${aff?`<div class="aff-card">
      <div class="aff-label">Только сегодня</div>
      <div class="aff-text" id="afft">${aff}</div>
    </div>`:''}
    <div class="actions">
      <button class="act-btn" onclick="copyText()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
        Копировать
      </button>
      <button class="act-btn" onclick="shareText()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
        Поделиться
      </button>
    </div>
    <div style="text-align:center;padding:4px 0 8px;font-size:10px;color:var(--dim);letter-spacing:.1em">na-russia.org</div>`;
}

function loadSettings(){
  const fs=localStorage.getItem('na_fs')||'16';
  const lh=localStorage.getItem('na_lh')||'1.75';
  const fi=parseInt(localStorage.getItem('na_font')||'0');
  const ti=parseInt(localStorage.getItem('na_theme')||'0');
  document.documentElement.style.setProperty('--fs',fs+'px');
  document.documentElement.style.setProperty('--lh',lh);
  document.documentElement.style.setProperty('--ff',FONTS[fi]);
  document.body.className=THEMES[ti];
  document.getElementById('fsr').value=fs;
  document.getElementById('lhr').value=lh;
  document.getElementById('fsv').textContent=fs+'px';
  document.getElementById('lhv').textContent=parseFloat(lh).toFixed(2);
  document.querySelectorAll('.chip').forEach(c=>c.classList.remove('on'));
  document.getElementById('f'+fi)?.classList.add('on');
  document.querySelectorAll('.sw').forEach(s=>s.classList.remove('on'));
  document.getElementById('t'+ti)?.classList.add('on');
}
function setFS(v){document.documentElement.style.setProperty('--fs',v+'px');document.getElementById('fsv').textContent=v+'px';localStorage.setItem('na_fs',v)}
function setLH(v){document.documentElement.style.setProperty('--lh',v);document.getElementById('lhv').textContent=parseFloat(v).toFixed(2);localStorage.setItem('na_lh',v)}
function setFont(i,el){document.documentElement.style.setProperty('--ff',FONTS[i]);document.querySelectorAll('.chip').forEach(c=>c.classList.remove('on'));el.classList.add('on');localStorage.setItem('na_font',i)}
function setTheme(i,el){document.body.className=THEMES[i];document.querySelectorAll('.sw').forEach(s=>s.classList.remove('on'));el.classList.add('on');localStorage.setItem('na_theme',i)}
function openPanel(){document.getElementById('panel').classList.add('on');document.getElementById('ovl').classList.add('on');document.getElementById('sbtn').classList.add('on')}
function closePanel(){document.getElementById('panel').classList.remove('on');document.getElementById('ovl').classList.remove('on');document.getElementById('sbtn').classList.remove('on')}
function copyText(){
  const q=document.querySelector('.quote-text')?.innerText||'';
  const b=document.getElementById('body')?.innerText||'';
  const a=document.getElementById('afft')?.innerText||'';
  navigator.clipboard.writeText(`${df}\n\n«${q}»\n\n${b}\n\nТолько сегодня: ${a}`).then(()=>showToast('Скопировано ✓')).catch(()=>showToast('Ошибка'));
}
function shareText(){
  const q=document.querySelector('.quote-text')?.innerText||'';
  if(navigator.share)navigator.share({title:'Ежедневник АН',text:`«${q}»\n\n${df}`});
  else navigator.clipboard.writeText(q).then(()=>showToast('Скопировано ✓'));
}
function showToast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2800)}
window.addEventListener('scroll',()=>{const t=document.body.scrollHeight-innerHeight;document.getElementById('bar').style.transform=`scaleX(${t>0?scrollY/t:0})`;},({passive:true}));
loadSettings();
loadToday();
</script>
</body>
</html>
